
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>陸上通過音センサー</title>
<style>
body{margin:0;background:#111;color:white;font-family:sans-serif;text-align:center}
h2{font-size:20px;margin:12px}
#view{position:relative;width:100%;overflow:hidden;background:#222}
video{display:block;width:100%;height:auto}
#line{position:absolute;top:0;bottom:0;left:50%;width:3px;background:red;pointer-events:none}
#status{padding:10px;color:#ffeb3b}
button{font-size:18px;padding:12px 20px;margin:6px;border:0;border-radius:9px;background:#2d8cff;color:white}
button:disabled{opacity:.5}
input{width:75%}
.controls{padding:10px}
label{display:block;margin:14px}
</style>
</head>
<body>
<h2>陸上 通過音センサー</h2>
<div id="view">
<video id="video" autoplay muted playsinline></video>
<div id="line"></div>
</div>
<div id="status">カメラを開始してください</div>
<div class="controls">
<button id="start">カメラ開始</button>
<button id="stop" disabled>停止</button>
<label>縦線の位置 <input id="position" type="range" min="10" max="90" value="50"></label>
<label>検知感度 <input id="sensitivity" type="range" min="10" max="100" value="45"></label>
<p>通過回数：<span id="count">0</span></p>
<button id="reset">回数リセット</button>
</div>
<canvas id="canvas" style="display:none"></canvas>
<script>
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
const statusEl=document.getElementById('status');
const line=document.getElementById('line');
const position=document.getElementById('position');
const sensitivity=document.getElementById('sensitivity');
let stream=null, running=false, previous=null, lastSound=0, count=0;
let audio=null, frameId=null, baseline=0;
position.oninput=()=>{line.style.left=position.value+'%';previous=null;baseline=0};
document.getElementById('reset').onclick=()=>{count=0;document.getElementById('count').textContent=0};
function beep(){
 if(!audio)return;
 const t=audio.currentTime;
 const osc=audio.createOscillator();
 const gain=audio.createGain();
 osc.type='sine';osc.frequency.value=1200;
 gain.gain.setValueAtTime(.25,t);
 gain.gain.exponentialRampToValueAtTime(.001,t+.12);
 osc.connect(gain);gain.connect(audio.destination);
 osc.start(t);osc.stop(t+.12);
}
function analyze(){
 if(!running)return;
 if(video.readyState>=2){
  const w=160,h=90;
  canvas.width=w;canvas.height=h;
  ctx.drawImage(video,0,0,w,h);
  const pixels=ctx.getImageData(0,0,w,h).data;
  const x=Math.round(w*Number(position.value)/100);
  const current=[];
  for(let y=10;y<h-10;y+=2){
   let sum=0;
   for(let dx=-2;dx<=2;dx++){
    const i=(y*w+Math.max(0,Math.min(w-1,x+dx)))*4;
    sum+=(pixels[i]*.299+pixels[i+1]*.587+pixels[i+2]*.114);
   }
   current.push(sum/5);
  }
  if(previous){
   let changed=0;
   for(let i=0;i<current.length;i++){
    if(Math.abs(current[i]-previous[i])>30)changed++;
   }
   const score=changed/current.length*100;
   baseline=baseline*.96+score*.04;
   const threshold=105-Number(sensitivity.value);
   const now=performance.now();
   if(score>threshold*.55 && score>baseline+12 && now-lastSound>900){
    lastSound=now;count++;
    document.getElementById('count').textContent=count;
    statusEl.textContent='通過を検知しました！';
    beep();
   }
  }
  previous=current;
 }
 frameId=requestAnimationFrame(analyze);
}
document.getElementById('start').onclick=async()=>{
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  await audio.resume();
  stream=await navigator.mediaDevices.getUserMedia({
   audio:false,video:{facingMode:{ideal:'environment'}}
  });
  video.srcObject=stream;
  await video.play();
  running=true;previous=null;baseline=0;
  statusEl.textContent='検知中';
  document.getElementById('start').disabled=true;
  document.getElementById('stop').disabled=false;
  analyze();
 }catch(e){statusEl.textContent='カメラを開始できません：'+e.message}
};
document.getElementById('stop').onclick=()=>{
 running=false;
 if(frameId)cancelAnimationFrame(frameId);
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;video.srcObject=null;previous=null;
 statusEl.textContent='停止中';
 document.getElementById('start').disabled=false;
 document.getElementById('stop').disabled=true;
};
</script>
</body>
</html>
